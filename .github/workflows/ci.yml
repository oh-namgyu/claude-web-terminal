name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      # lib/ws.js spawns /bin/zsh for every terminal, and the ubuntu runner
      # image does not ship zsh (checked against the Ubuntu 24.04 software
      # manifest — bash and dash only). Without it the terminal-output specs
      # skip themselves and CI goes green having tested nothing. `test -x`
      # afterwards turns a future image change into a loud failure.
      - name: Install zsh (required by the pty)
        run: |
          if [ ! -x /bin/zsh ]; then
            sudo apt-get update && sudo apt-get install -y zsh
          fi
          test -x /bin/zsh

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # playwright.config.ts already exports a deterministic default token,
          # but pin it explicitly so a future config change can't break CI.
          E2E_AUTH_TOKEN: e2e-test-token-cwt-12345
