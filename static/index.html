<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude-web-terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
      integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh"
      crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="sidebar-btn" id="agentsBtn" title="Claude Agents">🤖</button>
    <button class="sidebar-btn notify-off" id="agentsNotifyBtn" title="Enable idle notifications">🔔</button>
    <button class="sidebar-btn" id="agentsHelpBtn" title="Keyboard shortcuts">⌨️</button>
  </aside>

  <div class="agents-panel" id="agentsPanel">
    <div class="agents-panel-header">
      <span>Claude Code Sessions</span>
      <div class="agents-header-actions">
        <button class="agents-btn-icon" id="agentsNewBtn" title="New background session">➕</button>
        <button class="agents-btn-icon" id="agentsRefreshBtn" title="Refresh">🔄</button>
      </div>
    </div>
    <div class="agents-search-bar">
      <input type="text" id="agentsSearchInput" placeholder="Search sessions (name, cwd, id)..." />
      <div class="time-filter" id="timeFilter">
        <button class="time-filter-btn active" data-days="0">All</button>
        <button class="time-filter-btn" data-days="2">2d</button>
        <button class="time-filter-btn" data-days="5">5d</button>
        <button class="time-filter-btn" data-days="7">7d</button>
        <button class="time-filter-btn" data-days="14">2w</button>
        <button class="time-filter-btn" data-days="30">1m</button>
      </div>
    </div>
    <div class="new-agent-form" id="newAgentForm" hidden>
      <textarea id="newAgentPrompt" rows="2"
                placeholder="Initial prompt for the new background session."></textarea>
      <div class="new-agent-actions">
        <button class="btn-primary" id="newAgentSubmitBtn">Create</button>
        <button class="btn-secondary" id="newAgentCancelBtn">Cancel</button>
      </div>
    </div>
    <div class="agents-list" id="agentsList">
      <div class="agents-empty">Loading…</div>
    </div>
  </div>

  <main class="main">
    <div class="tab-bar" id="tabBar"></div>
    <div class="terminal-wrap">
      <div id="terminal"></div>
    </div>
    <div class="busy-bar" id="busyBar" hidden>
      <button class="busy-chip" id="busyChip" type="button">
        <span class="busy-spinner"></span>
        <span><span id="busyCount">0</span> session(s) working…</span>
      </button>
      <div class="busy-tooltip" id="busyTooltip" hidden></div>
    </div>
    <div class="ime-bar">
      <div class="slash-palette hidden" id="slashPalette" role="listbox" aria-label="Command palette"></div>
      <details class="cwd-picker" id="cwdPicker" title="Working directory for new tabs">
        <summary><span class="cwd-icon">📁</span><span class="cwd-label" id="cwdLabel">(default)</span><span class="cwd-arrow">▾</span></summary>
        <div class="cwd-menu" id="cwdMenu" role="listbox" aria-label="Working directory">
          <input type="text" class="cwd-search" id="cwdSearch" placeholder="filter…" autocomplete="off" />
          <div class="cwd-list" id="cwdList"></div>
        </div>
      </details>
      <textarea id="imeInput" rows="1"
                placeholder="IME-friendly input. Enter sends. Type / for commands, @ for files."
                autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <span class="ime-mode" id="imeMode">buffered</span>
      <div class="model-toggle" title="Switch model in the active tab">
        <button data-model="opus" class="model-btn">Opus</button>
        <button data-model="sonnet" class="model-btn">Sonnet</button>
        <button data-model="haiku" class="model-btn">Haiku</button>
      </div>
      <button class="btn-primary" id="imeSend">Send</button>
      <button class="btn-bg" id="imeBgSend" title="Start a new background session with this prompt">bgSend</button>
    </div>
  </main>
</div>

<div class="modal" id="editSessionModal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <span>Edit Session Name</span>
      <button class="modal-close" id="editModalClose">×</button>
    </div>
    <div class="modal-body">
      <label>Session ID: <code id="editSessionId"></code></label>
      <input type="text" id="editSessionName" placeholder="Enter new name" />
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="editModalCancel">Cancel</button>
      <button class="btn-primary" id="editModalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="shortcutsModal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <span>Keyboard shortcuts</span>
      <button class="modal-close" id="shortcutsModalClose">×</button>
    </div>
    <div class="modal-body">
      <table class="shortcuts-table">
        <tbody>
          <tr><td>New tab</td><td><kbd id="kbdT"></kbd></td></tr>
          <tr><td>Close active tab</td><td><kbd id="kbdW"></kbd></td></tr>
          <tr><td>Open Agent panel + focus search</td><td><kbd id="kbdK"></kbd></td></tr>
          <tr><td>Switch to nth tab (1–9)</td><td><kbd id="kbdN"></kbd></td></tr>
        </tbody>
      </table>
      <div class="shortcuts-note">
        Suppressed while an IME composition is active so they don't fight
        Korean / Chinese / Japanese input.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
        integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"
        integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL"
        crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
